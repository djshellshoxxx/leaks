# SPDX-License-Identifier: AGPL-3.0-or-later
# Candor audit schema registry (specs/20-LOGGING-AUDITING.md §5, §7; LOG-014).
# Changes to this file require the `audit-schema` review label and two
# code-owner approvals (27). It must equal candor_log::schema::registry_yaml();
# crates/candor-log/tests/schema_registry.rs fails on any drift.
version: 1
events:
  - type: "auth.login_succeeded"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "method"
        type: "AuthMethod"
        codes: ["FIDO2", "PIV", "TOTP", "SSO+FIDO2"]
      - name: "aal"
        type: "Aal"
        codes: ["AAL1", "AAL2", "AAL3"]
      - name: "authenticator_aaguid_class"
        type: "AaguidClass"
        codes: ["CERTIFIED", "UNCERTIFIED"]
      - name: "audience"
        type: "Audience"
        codes: ["DESK_API", "ADMIN_API"]
  - type: "auth.login_failed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "method"
        type: "AuthMethod"
        codes: ["FIDO2", "PIV", "TOTP", "SSO+FIDO2"]
      - name: "failure_code"
        type: "LoginFailure"
        codes: ["BAD_ASSERTION", "UV_MISSING", "UNKNOWN_CREDENTIAL", "SUSPENDED", "IDP_REJECTED"]
      - name: "audience"
        type: "Audience"
        codes: ["DESK_API", "ADMIN_API"]
  - type: "auth.stepup_succeeded"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "operation_class"
        type: "Code<OperationClass>"
      - name: "descriptor_hash_prefix"
        type: "HashPrefix8"
  - type: "auth.stepup_failed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "operation_class"
        type: "Code<OperationClass>"
      - name: "descriptor_hash_prefix"
        type: "HashPrefix8"
  - type: "auth.logout"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "reason_code"
        type: "SessionEndReason"
        codes: ["USER_LOGOUT", "IDLE_TIMEOUT", "ABSOLUTE_TIMEOUT", "REVOKED", "SUSPENDED", "DEVICE_REVOKED"]
  - type: "auth.session_expired"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "reason_code"
        type: "SessionEndReason"
        codes: ["USER_LOGOUT", "IDLE_TIMEOUT", "ABSOLUTE_TIMEOUT", "REVOKED", "SUSPENDED", "DEVICE_REVOKED"]
  - type: "auth.session_revoked"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "reason_code"
        type: "SessionEndReason"
        codes: ["USER_LOGOUT", "IDLE_TIMEOUT", "ABSOLUTE_TIMEOUT", "REVOKED", "SUSPENDED", "DEVICE_REVOKED"]
  - type: "auth.token_refreshed"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "auth.authenticator_enrolled"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "aaguid_class"
        type: "AaguidClass"
        codes: ["CERTIFIED", "UNCERTIFIED"]
      - name: "count_after"
        type: "SmallCount"
  - type: "auth.authenticator_removed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "aaguid_class"
        type: "AaguidClass"
        codes: ["CERTIFIED", "UNCERTIFIED"]
      - name: "count_after"
        type: "SmallCount"
  - type: "auth.totp_fallback_used"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "user.created"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "source"
        type: "DirectorySource"
        codes: ["MANUAL", "SCIM", "IDP"]
  - type: "user.suspended"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "source"
        type: "DirectorySource"
        codes: ["MANUAL", "SCIM", "IDP"]
  - type: "user.reactivated"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "source"
        type: "DirectorySource"
        codes: ["MANUAL", "SCIM", "IDP"]
  - type: "user.suspended_dormant"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "source"
        type: "DirectorySource"
        codes: ["MANUAL", "SCIM", "IDP"]
  - type: "user.authenticator_count_low"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
  - type: "user.enrollment_approved"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "approver"
        type: "UserRef"
  - type: "user.listed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "scope"
        type: "Code<ListScope>"
  - type: "device.custody_recorded"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "device"
        type: "DeviceKeyId"
      - name: "custody_class"
        type: "CustodyClass"
        codes: ["INDEPENDENT", "ORG"]
  - type: "device.custody_revoked"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "device"
        type: "DeviceKeyId"
      - name: "custody_class"
        type: "CustodyClass"
        codes: ["INDEPENDENT", "ORG"]
  - type: "device.enroll_requested"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "device.enrolled"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "device.revoked"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "role.assigned"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "role"
        type: "Role"
        codes: ["INTAKE_TRIAGER", "INVESTIGATOR", "CASE_LEAD", "REVIEWER", "CHANNEL_OWNER", "IDENTITY_CUSTODIAN", "LEGAL_COUNSEL", "OVERSIGHT", "RECORDS_OFFICER", "RECORDS_CUSTODIAN", "AUDITOR", "METRICS_VIEWER", "SECURITY_OFFICER", "SYS_ADMIN", "USER_ADMIN", "RECOVERY_TRUSTEE", "INDEPENDENT_APPROVER", "EMERGENCY_ADMIN"]
  - type: "role.revoked"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "role"
        type: "Role"
        codes: ["INTAKE_TRIAGER", "INVESTIGATOR", "CASE_LEAD", "REVIEWER", "CHANNEL_OWNER", "IDENTITY_CUSTODIAN", "LEGAL_COUNSEL", "OVERSIGHT", "RECORDS_OFFICER", "RECORDS_CUSTODIAN", "AUDITOR", "METRICS_VIEWER", "SECURITY_OFFICER", "SYS_ADMIN", "USER_ADMIN", "RECOVERY_TRUSTEE", "INDEPENDENT_APPROVER", "EMERGENCY_ADMIN"]
  - type: "role.expired"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "target"
        type: "UserRef"
      - name: "role"
        type: "Role"
        codes: ["INTAKE_TRIAGER", "INVESTIGATOR", "CASE_LEAD", "REVIEWER", "CHANNEL_OWNER", "IDENTITY_CUSTODIAN", "LEGAL_COUNSEL", "OVERSIGHT", "RECORDS_OFFICER", "RECORDS_CUSTODIAN", "AUDITOR", "METRICS_VIEWER", "SECURITY_OFFICER", "SYS_ADMIN", "USER_ADMIN", "RECOVERY_TRUSTEE", "INDEPENDENT_APPROVER", "EMERGENCY_ADMIN"]
  - type: "authz.denied"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "action"
        type: "Code<Action>"
      - name: "resource_kind"
        type: "Code<ResourceKind>"
      - name: "reason_code"
        type: "AuthzDenyReason"
        codes: ["NO_RELATION", "TENANT_MISMATCH", "STEP_UP_REQUIRED", "DUAL_CONTROL_REQUIRED", "STATE_INVALID", "SUSPENDED"]
  - type: "approval.created"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "dc_code"
        type: "DcCode"
      - name: "approver"
        type: "Option<UserRef>"
      - name: "effective_date"
        type: "Option<DayStamp>"
  - type: "approval.granted"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "dc_code"
        type: "DcCode"
      - name: "approver"
        type: "Option<UserRef>"
      - name: "effective_date"
        type: "Option<DayStamp>"
  - type: "approval.consumed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "dc_code"
        type: "DcCode"
      - name: "approver"
        type: "Option<UserRef>"
      - name: "effective_date"
        type: "Option<DayStamp>"
  - type: "approval.expired"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "dc_code"
        type: "DcCode"
      - name: "approver"
        type: "Option<UserRef>"
      - name: "effective_date"
        type: "Option<DayStamp>"
  - type: "breakglass.requested"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "case"
        type: "CaseRef"
      - name: "reason_code"
        type: "Code<BreakglassReason>"
      - name: "duration_min"
        type: "DurationMin"
      - name: "review_outcome"
        type: "Option<ReviewOutcome>"
        codes: ["PENDING", "JUSTIFIED", "NOT_JUSTIFIED"]
  - type: "breakglass.approved"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "case"
        type: "CaseRef"
      - name: "reason_code"
        type: "Code<BreakglassReason>"
      - name: "duration_min"
        type: "DurationMin"
      - name: "review_outcome"
        type: "Option<ReviewOutcome>"
        codes: ["PENDING", "JUSTIFIED", "NOT_JUSTIFIED"]
  - type: "breakglass.expired"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "case"
        type: "CaseRef"
      - name: "reason_code"
        type: "Code<BreakglassReason>"
      - name: "duration_min"
        type: "DurationMin"
      - name: "review_outcome"
        type: "Option<ReviewOutcome>"
        codes: ["PENDING", "JUSTIFIED", "NOT_JUSTIFIED"]
  - type: "breakglass.reviewed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "case"
        type: "CaseRef"
      - name: "reason_code"
        type: "Code<BreakglassReason>"
      - name: "duration_min"
        type: "DurationMin"
      - name: "review_outcome"
        type: "Option<ReviewOutcome>"
        codes: ["PENDING", "JUSTIFIED", "NOT_JUSTIFIED"]
  - type: "breakglass.wrap_refused"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "case"
        type: "CaseRef"
      - name: "reason_code"
        type: "Code<BreakglassReason>"
      - name: "duration_min"
        type: "DurationMin"
      - name: "review_outcome"
        type: "Option<ReviewOutcome>"
        codes: ["PENDING", "JUSTIFIED", "NOT_JUSTIFIED"]
  - type: "fleet.action"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "action_code"
        type: "Code<crate::codes::FleetAction>"
      - name: "outcome"
        type: "Outcome"
        codes: ["OK", "DENIED", "ERROR"]
  - type: "fleet.denied"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "action_code"
        type: "Code<crate::codes::FleetAction>"
      - name: "outcome"
        type: "Outcome"
        codes: ["OK", "DENIED", "ERROR"]
  - type: "cfg.changed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "key"
        type: "Code<ConfigKey>"
      - name: "class"
        type: "ConfigClass"
        codes: ["SAFE", "ADVANCED", "DANGEROUS"]
      - name: "old_value_hash"
        type: "Hash32"
      - name: "new_value"
        type: "ConfigValue"
  - type: "cfg.dangerous_enabled"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "key"
        type: "Code<ConfigKey>"
      - name: "expiry"
        type: "StaffTimer"
  - type: "cfg.dangerous_disabled"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "key"
        type: "Code<ConfigKey>"
      - name: "expiry"
        type: "StaffTimer"
  - type: "cfg.dangerous_expired"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "key"
        type: "Code<ConfigKey>"
      - name: "expiry"
        type: "StaffTimer"
  - type: "cfg.attestation_recorded"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "attestation_kind"
        type: "AttestationKind"
        codes: ["INFRA_BACKUP_EXCLUDES_VAULT"]
      - name: "attester"
        type: "UserRef"
  - type: "cfg.change_cancelled"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "cfg.workflow_published"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "channel.config_changed"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "keydir.entry_published"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "entry_kind"
        type: "KeydirEntryKind"
        codes: ["USER_KEY", "MEMBER_EPOCH_KEY", "CHANNEL_DESCRIPTOR", "CHANNEL_ROSTER", "OPERATOR_STATEMENT", "RELEASE"]
      - name: "entry_hash"
        type: "Hash32"
      - name: "publication_slot_date"
        type: "DayStamp"
  - type: "keydir.consistency_failure"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "observer"
        type: "Observer"
        codes: ["DESK", "WITNESS", "MONITOR", "CORE"]
      - name: "detail_code"
        type: "Code<KeydirDetail>"
  - type: "keydir.snapshot_rejected"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "keydir.epoch_destroyed"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "audit.checkpoint_signed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "stream"
        type: "StreamId"
        codes: ["sec", "case", "sys"]
      - name: "seq_range"
        type: "SeqRange"
      - name: "root"
        type: "Hash32"
  - type: "audit.witness_cosigned"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "witness_id"
        type: "WitnessId"
      - name: "checkpoint_seq"
        type: "Seq"
  - type: "audit.witness_failed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "witness_id"
        type: "WitnessId"
      - name: "checkpoint_seq"
        type: "Seq"
  - type: "audit.verification_failed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "stream"
        type: "StreamId"
        codes: ["sec", "case", "sys"]
      - name: "seq"
        type: "Seq"
      - name: "failure_code"
        type: "VerifyFailureCode"
        codes: ["CHAIN_MISMATCH", "SEQUENCE_GAP", "SEQUENCE_ORDER", "NON_CANONICAL", "ENVELOPE_MISMATCH", "MERKLE_MISMATCH", "BAD_SIGNATURE", "CHECKPOINT_CHAIN", "TRUNCATED", "ROLLBACK", "MISSING_PREFIX"]
  - type: "audit.exported"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "stream"
        type: "StreamId"
        codes: ["sec", "case", "sys"]
      - name: "seq_range"
        type: "SeqRange"
      - name: "destination_class"
        type: "DestinationClass"
        codes: ["AUDITOR_FILE", "REGULATOR", "LAW_ENFORCEMENT", "COUNSEL", "INTEGRATION", "INTERNAL"]
      - name: "approvers"
        type: "Approvers"
      - name: "recipient_key_fingerprint"
        type: "Hash32"
  - type: "audit.viewed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "stream"
        type: "StreamId"
        codes: ["sec", "case", "sys"]
      - name: "seq_range"
        type: "SeqRange"
  - type: "audit.read"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "stream"
        type: "StreamId"
        codes: ["sec", "case", "sys"]
      - name: "filter_kind"
        type: "Code<FilterKind>"
      - name: "result_count_bucket"
        type: "CountBucket"
        codes: ["1", "2-9", "10-99", ">=100"]
  - type: "audit.retention_tombstone"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "stream"
        type: "StreamId"
        codes: ["sec", "case", "sys"]
      - name: "seq_range"
        type: "SeqRange"
      - name: "last_deleted_checkpoint_root"
        type: "Hash32"
  - type: "secret.placement_violation"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "host_role"
        type: "HostRole"
        codes: ["intake", "core", "monitor", "desk"]
      - name: "secret_kind"
        type: "Code<SecretKind>"
  - type: "selftest.logging_violation"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "host_role"
        type: "HostRole"
        codes: ["intake", "core", "monitor", "desk"]
      - name: "check_code"
        type: "LoggingCheck"
        codes: ["TOR_LOG_ENABLED", "TOR_SAFELOGGING_OFF", "ACCESS_LOG_PRESENT", "JOURNAL_PERSISTENT", "NFT_LOG_RULE", "COREDUMP_ENABLED", "UNEXPECTED_LOG_FILE", "CAPTURE_TOOL_RUNNING"]
  - type: "update.applied"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "component"
        type: "Component"
        codes: ["CANDOR", "TOR", "POSTGRES", "OS", "DESK", "SANDBOX_IMAGE"]
      - name: "version"
        type: "Version"
      - name: "reason_code"
        type: "Option<UpdateReason>"
        codes: ["SIGNATURE_INVALID", "ROLLBACK", "FREEZE", "BELOW_FLOOR", "NOT_IN_LOG"]
  - type: "update.rejected"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "component"
        type: "Component"
        codes: ["CANDOR", "TOR", "POSTGRES", "OS", "DESK", "SANDBOX_IMAGE"]
      - name: "version"
        type: "Version"
      - name: "reason_code"
        type: "Option<UpdateReason>"
        codes: ["SIGNATURE_INVALID", "ROLLBACK", "FREEZE", "BELOW_FLOOR", "NOT_IN_LOG"]
  - type: "backup.completed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "backup_id"
        type: "BackupId"
      - name: "scope"
        type: "BackupScope"
        codes: ["CORE", "INTAKE", "VAULT", "AUDIT"]
      - name: "erasure_log_applied"
        type: "bool"
      - name: "intake_deletion_list_applied"
        type: "bool"
  - type: "backup.restore_performed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "backup_id"
        type: "BackupId"
      - name: "scope"
        type: "BackupScope"
        codes: ["CORE", "INTAKE", "VAULT", "AUDIT"]
      - name: "erasure_log_applied"
        type: "bool"
      - name: "intake_deletion_list_applied"
        type: "bool"
  - type: "platform.mismatch"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "component"
        type: "Component"
        codes: ["CANDOR", "TOR", "POSTGRES", "OS", "DESK", "SANDBOX_IMAGE"]
      - name: "expected_manifest_hash_prefix"
        type: "HashPrefix8"
      - name: "reason_code"
        type: "PlatformReason"
        codes: ["BELOW_FLOOR", "MANIFEST_MISMATCH"]
  - type: "ekv.rewrap_opened"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "affected_case_bucket"
        type: "CountBucket"
        codes: ["1", "2-9", "10-99", ">=100"]
      - name: "approvers"
        type: "Approvers"
  - type: "ekv.rewrap_closed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "affected_case_bucket"
        type: "CountBucket"
        codes: ["1", "2-9", "10-99", ">=100"]
      - name: "approvers"
        type: "Approvers"
  - type: "tenant.created"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "tenant"
        type: "TenantRef"
  - type: "tenant.deleted"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "tenant"
        type: "TenantRef"
  - type: "onion.rotated"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "metrics.aggregate_viewed"
    class: SECURITY
    stream: sec
    ts: staff
    fields:
      - name: "report_id"
        type: "ReportId"
  - type: "support.bundle_created"
    class: SECURITY
    stream: sec
    ts: staff
    fields: []
  - type: "case.imported"
    class: CASE
    stream: case
    ts: date_only
    fields:
      - name: "case"
        type: "CaseRef"
      - name: "channel_id"
        type: "ChannelId"
      - name: "received_day"
        type: "DayStamp"
      - name: "import_slot_date"
        type: "DayStamp"
  - type: "case.envelope_rejected"
    class: CASE
    stream: case
    ts: date_only
    fields:
      - name: "pending_envelope_bucket"
        type: "CountBucket"
        codes: ["1", "2-9", "10-99", ">=100"]
      - name: "approvers"
        type: "Approvers"
  - type: "case.state_changed"
    class: CASE
    stream: case
    ts: staff
    fields:
      - name: "case"
        type: "CaseRef"
      - name: "from_state"
        type: "CaseState"
        codes: ["PENDING_IMPORT", "NEW", "TRIAGE", "ASSESSMENT", "INVESTIGATION", "ON_HOLD", "DECISION", "REMEDIATION", "CLOSED", "REFERRED", "DISMISSED", "RETAINED", "DISPOSED"]
