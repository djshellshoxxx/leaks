# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-fuzz layout (ST-051 fuzz_audit_log_verify; AUD-RM1-LOG-10). Run with:
#   cargo +nightly fuzz run <target>   (from crates/candor-log)
# Own workspace so the main workspace never builds libFuzzer (the root
# `members = ["crates/*"]` glob does not reach this nested directory).
# No network, no filesystem access: every target works on in-memory bytes.
[package]
name = "candor-log-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
candor-log = { path = ".." }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[workspace]
members = ["."]

[[bin]]
name = "fuzz_cbor_decode"
path = "fuzz_targets/fuzz_cbor_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_jsonl_read_verify"
path = "fuzz_targets/fuzz_jsonl_read_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_checkpoint_parse"
path = "fuzz_targets/fuzz_checkpoint_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_audit_log_verify"
path = "fuzz_targets/fuzz_audit_log_verify.rs"
test = false
doc = false
bench = false
