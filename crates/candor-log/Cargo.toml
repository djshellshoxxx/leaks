# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "candor-log"
version = "0.1.0"
description = "Candor privacy-preserving typed audit logging, hash-chained audit streams, signed checkpoints, SIEM scrubbing and the 24 §TEL metrics regime"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sha2 = { version = "=0.11.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.149", default-features = false, features = ["std"] }
getrandom = { version = "=0.4.3", default-features = false }
subtle = { version = "=2.6.1", default-features = false }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
trybuild = "=1.0.116"

[lints]
workspace = true
