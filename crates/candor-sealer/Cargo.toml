# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "candor-sealer"
version = "0.1.0"
description = "Candor Intake Sealer (C-07): isolated in-RAM Tier W drafting, sealing, login and chaff; owns the sealer IPC protocol"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# The `proto` module (IPC types, CBOR codec, framing) needs only `zeroize`.
# `server` adds the sealer process itself.
server = [
    "dep:candor-core",
    "dep:candor-safefs",
    "dep:tokio",
    "dep:rustix",
    "dep:hkdf",
    "dep:sha2",
    "dep:subtle",
    "dep:unicode-normalization",
]

# Every dependency is justified in SPEC-NOTES.md ("Dependencies").
[dependencies]
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
candor-core = { path = "../candor-core", optional = true }
candor-safefs = { path = "../candor-safefs", optional = true }
tokio = { version = "=1.48.0", default-features = false, features = ["rt", "net", "sync", "time", "io-util"], optional = true }
rustix = { version = "=1.1.2", default-features = false, features = ["std", "mm", "process"], optional = true }
hkdf = { version = "=0.13.0", default-features = false, optional = true }
sha2 = { version = "=0.11.0", default-features = false, optional = true }
subtle = { version = "=2.6.1", default-features = false, optional = true }
unicode-normalization = { version = "=0.1.24", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "=1.48.0", default-features = false, features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util", "macros", "test-util"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = { version = "=3.23.0", default-features = false }
