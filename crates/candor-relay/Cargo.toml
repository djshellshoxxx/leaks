# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "candor-relay"
version = "0.1.0"
description = "Candor Relay (C-09): fixed-slot intake pull, replay protection, hostile-input validation, and core-zone staging"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast"] }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
