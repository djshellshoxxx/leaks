# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "candor-memlock"
version = "0.1.0"
description = "Candor OS shim (the only crate allowed `unsafe`): systemd socket-activation adoption for the intake daemons (IMPL-00 §4.5, SI-A-04)"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Safe wrappers for getpid/gettid (main-thread guard), fcntl CLOEXEC and the SO_DOMAIN /
# SO_TYPE / SO_ACCEPTCONN checks on the adopted descriptor. Already in Cargo.lock.
rustix = { version = "=1.1.2", default-features = false, features = ["std", "net", "process", "thread"] }

[[test]]
# Runs on the main thread of its own process (no libtest harness): the only way to exercise
# the real adoption path, which requires a single-threaded process (env removal) and fd 3.
name = "activation"
harness = false

# IMPL-00 §4.2: every workspace lint re-declared, except `unsafe_code`, which is `forbid` in
# [workspace.lints] and cannot be relaxed per crate (SPEC-NOTES decision 1). `unsafe_code` is
# `deny` here and allowed on exactly one module (`src/sys.rs`) and the harness-less test.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
