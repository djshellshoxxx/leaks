# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "candor-authz"
version = "0.1.0"
description = "Candor authorization engine (C-22): pure deny-by-default RBAC/ABAC/ACL decisions, blinded COI exclusion, dual control, break-glass, signed policy bundles and the route/permission matrix lint"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Every dependency is justified in SPEC-NOTES.md ("Dependencies").
[dependencies]
candor-core = { path = "../candor-core", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.149", default-features = false, features = ["std"] }
subtle = { version = "=2.6.1", default-features = false }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
