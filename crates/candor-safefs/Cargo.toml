[package]
name = "candor-safefs"
version = "0.1.0"
description = "Candor single audited safe-path, content-addressed store and archive-extraction API (ADR-027)"
license = "Apache-2.0 OR MIT"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-std = { version = "=3.4.5", default-features = false }
cap-fs-ext = { version = "=3.4.5", default-features = false, features = ["std"] }
rustix = { version = "=1.1.2", default-features = false, features = ["std", "fs", "process"] }
getrandom = { version = "=0.4.3", default-features = false }
blake3 = { version = "=1.8.2", default-features = false }
zeroize = { version = "=1.8.2", default-features = false, features = ["zeroize_derive"] }
unicode-normalization = { version = "=0.1.24", default-features = false, features = ["std"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.5", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = { version = "=3.23.0", default-features = false }

[lints]
workspace = true
