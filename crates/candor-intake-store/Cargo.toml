# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "candor-intake-store"
version = "0.1.0"
description = "Candor Intake Store (C-08): IntakeStore trait, PostgreSQL and in-memory implementations"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Every dependency is justified in SPEC-NOTES.md ("Dependencies").
[dependencies]
candor-core = { path = "../candor-core" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
uuid = { version = "=1.18.1", default-features = false }
tokio = { version = "=1.48.0", default-features = false, features = ["sync"] }
sha2 = { version = "=0.11.0", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "=1.48.0", default-features = false, features = ["rt", "macros", "sync"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
