[package]
name = "candor-source-ui"
version = "0.1.0"
description = "Candor Tier W source web UI: server-rendered, no-JavaScript templates, catalogs and page contract (C-06)."
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
askama = { version = "=0.16.1", default-features = false, features = ["derive", "std"] }
fluent-bundle = { version = "=0.16.0", default-features = false }
fluent-syntax = { version = "=0.12.0", default-features = false }
unic-langid = { version = "=0.9.6", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[features]
# Sample view models (`preview` module) and pseudo-locale tag parsing, for tests, CI and the
# `render_all` example only. Never enable in the C-06 production build (AUD-RM1-SUI-04/-09).
preview = []

[dev-dependencies]
# Self dev-dependency: turns on `preview` for tests and examples only.
candor-source-ui = { path = ".", version = "=0.1.0", features = ["preview"] }
scraper = { version = "=0.27.0", default-features = false, features = ["errors"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
