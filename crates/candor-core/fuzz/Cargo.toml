# SPDX-License-Identifier: Apache-2.0 OR MIT
# cargo-fuzz layout (§22.3, CRYPTO-039; ST-040/041/042). Run with (from crates/candor-core):
#   cargo +nightly fuzz run <target> fuzz/corpus/<target> fuzz/seeds/<target> -- -max_len=<see README>
# Own workspace so the main workspace never builds libFuzzer.
[package]
name = "candor-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0 OR MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
candor-core = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "fuzz_header"
path = "fuzz_targets/fuzz_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_slot_block"
path = "fuzz_targets/fuzz_slot_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_stanza"
path = "fuzz_targets/fuzz_stanza.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_record"
path = "fuzz_targets/fuzz_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_envelope_parse"
path = "fuzz_targets/fuzz_envelope_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_stream_decrypt"
path = "fuzz_targets/fuzz_stream_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hpke_open"
path = "fuzz_targets/fuzz_hpke_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_recipient_entry"
path = "fuzz_targets/fuzz_recipient_entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_normalize"
path = "fuzz_targets/fuzz_normalize.rs"
test = false
doc = false
bench = false
