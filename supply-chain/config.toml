
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.candor-core]
criteria = "safe-to-deploy"

[policy.candor-core.dependency-criteria]
argon2 = ["safe-to-deploy", "candor-crypto-reviewed"]
blake3 = ["safe-to-deploy", "candor-crypto-reviewed"]
chacha20poly1305 = ["safe-to-deploy", "candor-crypto-reviewed"]
ed25519-dalek = ["safe-to-deploy", "candor-crypto-reviewed"]
getrandom = ["safe-to-deploy", "candor-crypto-reviewed"]
hkdf = ["safe-to-deploy", "candor-crypto-reviewed"]
hmac = ["safe-to-deploy", "candor-crypto-reviewed"]
hpke = ["safe-to-deploy", "candor-crypto-reviewed"]
rand_chacha = ["safe-to-deploy", "candor-crypto-reviewed"]
sha2 = ["safe-to-deploy", "candor-crypto-reviewed"]
subtle = ["safe-to-deploy", "candor-crypto-reviewed"]
zeroize = ["safe-to-deploy", "candor-crypto-reviewed"]

[policy.candor-intake-store]
criteria = "safe-to-deploy"

[policy.candor-intake-store.dependency-criteria]
