# Runtime and state directories on H-INTAKE. Installed as /usr/lib/tmpfiles.d/candor-intake.conf.
# 07 §4.1: each /run/candor/<svc>/ directory is 0750, owned by the server user, with group =
# the single permitted client. Sockets inside are created by PID 1 (*.socket units).
#Type Path                                    Mode User                Group                  Age
d     /run/candor                             0755 root                root                   -
d     /run/candor/source-web                  0750 candor-web          _tor-candor-intake     -
d     /run/candor/sealer                      0750 candor-sealer       candor-web             -
d     /run/candor/istore                      0750 candor-istore       candor-istore-clients  -
d     /run/candor/intake-pg                   0750 postgres            candor-istore          -
# PostgreSQL cumulative statistics (data_directory/pg_stat is a symlink to it): RAM only, so the
# stats file written at shutdown never reaches persistent storage (AUD-RM2-STO-11).
d     /run/candor/intake-pg-stat              0700 postgres            postgres               -
# Signed config bundle (no secrets; rendered by candorctl) and the Key Directory snapshot
# (public keys; written by the intake store when C-09 pushes it, read by the sealer).
d     /run/candor/config                      0755 root                root                   -
d     /run/candor/directory                   0750 candor-istore       candor-sealer          -
# Persistent state (on the LUKS2 volume mounted nodev,nosuid,noexec; 17 §5.1).
d     /var/lib/candor                         0755 root                root                   -
d     /var/lib/candor/intake                  0700 candor-istore       candor-istore          -
d     /var/lib/candor/intake/blobs            0700 candor-istore       candor-istore          -
# Blob-volume throughput self-test (config-check --host section blobrate, O-6 / STO-29): root only,
# outside the candor-safefs tree so the store never sees the test file; same volume as blobs.
d     /var/lib/candor/selftest                0700 root                root                   -
# Relay endpoint public certificate only (private key is a TPM-sealed credential).
d     /var/lib/candor/relay                   0755 root                root                   -
d     /var/lib/tor-instances                  0755 root                root                   -
d     /var/lib/tor-instances/candor-intake    0700 _tor-candor-intake  _tor-candor-intake     -
d     /var/lib/postgresql/16/candor-intake    0700 postgres            postgres               -
# TPM-sealed systemd credentials (ADR-028; R7 SI-B-01). Readable by root (PID 1) only.
d     /etc/credstore.encrypted                0700 root                root                   -
