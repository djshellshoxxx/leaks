# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Secret Placement Manifest - role "intake" (H-INTAKE; ADR-028, 18-DEPLOYMENT.md §15,
# 17-INFRASTRUCTURE.md §4.9, NET-016/019/020/043). Ships signed in the role package as
# /usr/share/candor/manifests/intake.toml and is verified by deploy/tools/check-placement.sh
# after every deploy and daily (self-test `secret.placement`, `perm.secrets`).
#
# Semantics: the set of secret-bearing files found on the host must EQUAL the active entries
# below (entries whose flags are all enabled; "always" is always enabled). Any other match of
# a scan pattern is a violation (B-SD-22 class fix), as is a required entry that is missing,
# a wrong owner/group/mode, a symlink, or a hard link (link count != 1).
#
# Format: a deliberately small TOML subset parsed by check-placement.sh with POSIX tools only
# (no interpreter on H-INTAKE, 17 §5.1): top-level `key = value` lines, [scan] and
# [forbidden] tables and [[secret]] array-of-tables; values are "strings" (no escapes),
# ["string", ...] arrays, integers, true/false. Anything else is a parse error (fail closed).
# 18 §15.1 shows YAML; TOML is used here per the RM-2 brief (SPEC-NOTES D-12).
#
# Secrets loaded by services come from TPM-sealed systemd credentials (LoadCredentialEncrypted=,
# R7 SI-B-01) in /etc/credstore.encrypted (root 0700, files root 0400): PID 1 unseals them into
# the unit's private /run/credentials/<unit>/ at start, so no service user can read another
# service's secret or the sealed file itself (SPEC-NOTES D-13).

manifest_version = 1
role = "intake"
profiles = ["CE-SINGLE", "CE-HARDENED"]

# ------------------------------------------------------------------ K16 source onion key
[[secret]]
id = "onion.source.hs_ed25519_secret_key"
key = "K16"
path = "/var/lib/tor-instances/candor-intake/hs-source/hs_ed25519_secret_key"
owner = "_tor-candor-intake"
group = "_candor-torctl"
mode = "0600"
parent_mode = "0700"
pattern = "tor_hs_secret_key"
provenance = "generated_on_host"
backup_set = "BS-SECRETS"
flags = ["always"]
required = true

# ------------------------------------------------------------------ K37 Intake Routing Key (C-08)
[[secret]]
id = "intake.routing_key"
key = "K37"
path = "/etc/credstore.encrypted/candor-intake.routing_key.cred"
owner = "root"
group = "root"
mode = "0400"
parent_mode = "0700"
pattern = "none"
provenance = "generated_on_host"
backup_set = "BS-SECRETS"
flags = ["always"]
required = true

# ------------------------------------------------------------------ K31 intake batch signing key (C-08)
# Not listed in 18 §15.1; required by 04 §19 K31 ("intake host, TPM-sealed").
[[secret]]
id = "intake.batch_signing_key"
key = "K31"
path = "/etc/credstore.encrypted/candor-intake.batch_signing_key.cred"
owner = "root"
group = "root"
mode = "0400"
parent_mode = "0700"
pattern = "none"
provenance = "generated_on_host"
backup_set = "none"
flags = ["always"]
required = true

# ------------------------------------------------------------------ relay mTLS server key (C-08 I1)
[[secret]]
id = "relay.server_tls_key"
key = "relay-mTLS"
path = "/etc/credstore.encrypted/candor-intake.relay_tls_key.cred"
owner = "root"
group = "root"
mode = "0400"
parent_mode = "0700"
pattern = "none"
provenance = "generated_on_host"
backup_set = "none"
flags = ["always"]
required = true

# ------------------------------------------------------------------ K35 sealer signing key (C-07)
# Not listed in 18 §15.1; required by 04 §19 K35 ("intake host, TPM-sealed").
[[secret]]
id = "sealer.signing_key"
key = "K35"
path = "/etc/credstore.encrypted/candor-intake.sealer_signing_key.cred"
owner = "root"
group = "root"
mode = "0400"
parent_mode = "0700"
pattern = "none"
provenance = "generated_on_host"
backup_set = "none"
flags = ["always"]
required = true

# ------------------------------------------------------------------ per-deployment Argon2id salt (C-07)
[[secret]]
id = "intake.argon2_deployment_salt"
key = "salt"
path = "/etc/credstore.encrypted/candor-intake.argon2_salt.cred"
owner = "root"
group = "root"
mode = "0400"
parent_mode = "0700"
pattern = "none"
provenance = "generated_on_host"
backup_set = "BS-SECRETS"
flags = ["always"]
required = true

# ------------------------------------------------------------------ systemd credential host key
# Exists only when credentials are sealed with the host key (+TPM); absent with TPM-only sealing.
[[secret]]
id = "host.systemd_credential_secret"
key = "host-cred"
path = "/var/lib/systemd/credential.secret"
owner = "root"
group = "root"
mode = "0400"
parent_mode = "0755"
pattern = "none"
provenance = "generated_on_host"
backup_set = "none"
flags = ["always"]
required = false

# ------------------------------------------------------------------ C-25 agent mTLS client key (18 §15.2)
# Owned by the candor-health package (not part of deploy/intake); required once it is installed.
[[secret]]
id = "health.agent_tls_key"
key = "agent-mTLS"
path = "/etc/credstore.encrypted/candor-health.agent_tls_key.cred"
owner = "root"
group = "root"
mode = "0400"
parent_mode = "0700"
pattern = "none"
provenance = "generated_on_host"
backup_set = "none"
flags = ["always"]
required = false

# ------------------------------------------------------------------ backup agent "intake set signer" (18 §15.2)
[[secret]]
id = "backup.intake_set_signer"
key = "backup-signer"
path = "/etc/credstore.encrypted/candor-backup.intake_signer.cred"
owner = "root"
group = "root"
mode = "0400"
parent_mode = "0700"
pattern = "none"
provenance = "generated_on_host"
backup_set = "none"
flags = ["always"]
required = false

# ------------------------------------------------------------------ optional sshd (I2) host key
[[secret]]
id = "ssh.host_ed25519_key"
key = "ssh-host"
path = "/etc/ssh/ssh_host_ed25519_key"
owner = "root"
group = "root"
mode = "0600"
parent_mode = "0755"
pattern = "openssh_private_key"
provenance = "generated_on_host"
backup_set = "none"
flags = ["sshd"]
required = true

# ------------------------------------------------------------------ optional SSH onion (remote sites; 18 §15.1/§15.2)
[[secret]]
id = "onion.ssh.hs_ed25519_secret_key"
key = "K16-ssh"
path = "/var/lib/tor-instances/candor-ssh/hs-ssh/hs_ed25519_secret_key"
owner = "_tor-candor-ssh"
group = "_tor-candor-ssh"
mode = "0600"
parent_mode = "0700"
pattern = "tor_hs_secret_key"
provenance = "generated_on_host"
backup_set = "BS-SECRETS"
flags = ["ssh_onion"]
required = true

[scan]
# Full scan (daily, after deploy): whole filesystem minus virtual filesystems.
roots = ["/"]
# Light scan (every 5 min, 32 `secret.placement`): where misplaced keys realistically land.
light_roots = ["/etc", "/root", "/home", "/var/lib", "/var/tmp", "/var/backups", "/srv", "/opt", "/usr/local", "/tmp", "/run"]
exclude = ["/proc", "/sys", "/dev", "/run/user", "/run/credentials"]
# Ciphertext-only directories: contents are NOT read (reading would touch atimes of source
# data and costs I/O); instead every entry name must match the given layout.
name_only_blobs = "/var/lib/candor/intake/blobs"
name_only_staging = "/run/candor/staging"
# Files larger than this are not content-scanned (keys are small); see SPEC-NOTES residuals.
max_file_kib = 1024
patterns = ["pem_private_key", "openssh_private_key", "tor_hs_secret_key", "tor_client_auth_private", "age_or_hpke_identity", "openpgp_secret_packet", "jwk_private", "pkcs12"]

[forbidden]
# Never on any server (ADR-007, 18 §15.1/§15.2, NET-020). Any unlisted pattern hit already
# fails; these ids name what such a hit most likely is, for the operator.
ids = ["staff.private_key", "case_key_plaintext", "epoch_private_key_plaintext", "irk_share", "onion.standby_key", "rcp_onion.client_auth_private"]
