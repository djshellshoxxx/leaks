# SPDX-License-Identifier: AGPL-3.0-or-later
# Candor intake PostgreSQL 16 cluster (C-08). Complete server configuration, installed as
# /etc/candor/intake/postgresql/candor-intake.conf (root:postgres 0640) and passed with
# `-c config_file=` by candor-intake-pg.service. Normative: 09-DATABASE.md §10, DB-021,
# DB-022, ADR-046(1), 20 LOG-008, R7 SI-E-01/SI-E-04. No include directives: the effective
# configuration is exactly this file (config-check.sh rejects include/include_dir).

#---------------------------------------------------------------- files
data_directory = '/var/lib/postgresql/16/candor-intake'
hba_file = '/etc/candor/intake/postgresql/pg_hba.conf'
ident_file = '/etc/candor/intake/postgresql/pg_ident.conf'

#---------------------------------------------------------------- connections (DB-022)
listen_addresses = ''                         # Unix socket only, no TCP at all
port = 5432                                   # only names the socket file
unix_socket_directories = '/run/candor/intake-pg'
unix_socket_group = 'candor-istore'
unix_socket_permissions = 0770
max_connections = 40                          # 09 §10
superuser_reserved_connections = 3
password_encryption = 'scram-sha-256'
ssl = off                                     # no network listener to protect
krb_server_keyfile = ''
bonjour = off
idle_in_transaction_session_timeout = '60s'   # 09 §10 roles
temp_file_limit = '1GB'

#---------------------------------------------------------------- WAL: no replication, no archive (ADR-046(1))
wal_level = minimal
archive_mode = off
archive_command = ''
max_wal_senders = 0
max_replication_slots = 0
wal_keep_size = 0
track_commit_timestamp = off                  # no pg_commit_ts store (ADR-010); WAL commit records still carry xact_time, see below
fsync = on                                    # 09 §10 durability; "received" only after fsync (ADR-046(1))
synchronous_commit = on
full_page_writes = on
wal_compression = off
wal_init_zero = on
# 09 §10 / 09 §13 "small WAL" (AUD-RM2-DEP-07): every WAL commit record carries the commit time
# (ms) regardless of track_commit_timestamp, so the WAL is kept as small as the spec allows and
# old segments are removed instead of being renamed with their content (wal_recycle = off).
# Residual (commit times inside the <= 256 MB of live WAL) is handled by AT-007/AT-020; see
# deploy/SPEC-NOTES.md D-29.
max_wal_size = '256MB'
min_wal_size = '32MB'
wal_recycle = off
checkpoint_timeout = '5min'

#---------------------------------------------------------------- resources
shared_buffers = '256MB'
huge_pages = off
dynamic_shared_memory_type = posix
shared_memory_type = mmap
jit = off                                     # MemoryDenyWriteExecute=yes in the unit
shared_preload_libraries = ''
session_preload_libraries = ''
local_preload_libraries = ''
dynamic_library_path = '$libdir'

#---------------------------------------------------------------- statistics (09 §10)
track_activities = on
track_activity_query_size = 1024
track_counts = on                             # needed by autovacuum
track_io_timing = off
track_wal_io_timing = off
track_functions = none
update_process_title = off                    # no role/db/state in `ps` output

#---------------------------------------------------------------- vacuum (09 §10 Deletion)
autovacuum = on
autovacuum_vacuum_scale_factor = 0.01

#---------------------------------------------------------------- logging (DB-021, LOG-008, ADR-016)
# AUD-RM2-STO-02: expected-path errors (e.g. a unique violation on a source retry) would
# otherwise become ERROR lines stamped to the millisecond = exact time of a source action.
# Only PANIC is emitted at all, to stderr, which candor-intake-pg.service discards
# (StandardError=null). No log files, no SQL text, no parameters, no connection, role,
# database or host fields, no timing events. Residual: SPEC-NOTES D-26.
logging_collector = off
log_destination = 'stderr'
log_min_messages = panic
log_min_error_statement = panic               # SQL text never logged
log_error_verbosity = terse
log_statement = 'none'
log_duration = off
log_min_duration_statement = -1
log_min_duration_sample = -1
log_statement_sample_rate = 0
log_transaction_sample_rate = 0
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_connections = off
log_disconnections = off
log_hostname = off
log_checkpoints = off                         # PG >= 15 default is on: would timestamp write activity
log_autovacuum_min_duration = -1              # PG >= 15 default 10min: would log table activity
log_lock_waits = off
log_recovery_conflict_waits = off
log_temp_files = -1
log_replication_commands = off
log_startup_progress_interval = 0
# No %m/%t (journald already stamps lines), no %u %d %h %r %a %p %c %l %i %q-fields.
log_line_prefix = '%e '
log_timezone = 'UTC'
timezone = 'UTC'
debug_print_parse = off
debug_print_rewritten = off
debug_print_plan = off
debug_pretty_print = off
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off
log_statement_stats = off
client_min_messages = notice
