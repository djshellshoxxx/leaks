# Intake cluster client authentication (09 §10 Auth, DB-022, R7 SI-E-01). Installed as
# /etc/candor/intake/postgresql/pg_hba.conf (root:postgres 0640).
# 09 §10 + ADR-052(9): only the OS user candor-istore as DB role candor_istore, and the
# migration OS user candor-migrate as the (non-superuser) migration role candor_migrate, both
# over the Unix socket and peer-authenticated through pg_ident maps, to the tenant
# database(s) only; everything else is rejected - including the postgres superuser. No
# superuser single-user mode for migrations (ADR-052(9)); bootstrap only, see SPEC-NOTES D-11.
# config-check.sh compares this file line by line with its baseline (AUD-RM2-DEP-19).
# No host/hostssl/hostnossl/hostgssenc lines: there is no TCP listener (listen_addresses='').
# TYPE  DATABASE          USER            METHOD
local   /^candor_intake_  candor_istore   peer map=candor
local   /^candor_intake_  candor_migrate  peer map=migrate
local   all               all             reject
