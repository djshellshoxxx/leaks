# Candor H-INTAKE system users (07-BACKEND.md §4.1: one UID per service, no shared UIDs,
# nologin shells, no service as root; 16 §7.3: separate user per tor instance).
# Installed as /usr/lib/sysusers.d/candor-intake.conf.
#
# Every UID/group named in nftables.conf (meta skuid) is created here too, even when the
# owning package (tor update instance, health agent, chrony) is installed later: nft refuses
# to load a ruleset that names an unknown user, and a ruleset that fails to load leaves the
# host with no filter. (Candor units also Require=nftables.service, so they would not start.)
#
#Type Name                 ID  GECOS                                           Home                                  Shell
u     _tor-candor-intake   -   "Candor intake tor instance (C-05)"             /var/lib/tor-instances/candor-intake  /usr/sbin/nologin
u     _tor-candor-update   -   "Candor update/time tor client (E2)"            /var/lib/tor-instances/candor-update  /usr/sbin/nologin
u     candor-web           -   "Candor source web (C-06)"                      /                                     /usr/sbin/nologin
u     candor-sealer        -   "Candor sealer (C-07)"                          /                                     /usr/sbin/nologin
u     candor-istore        -   "Candor intake store (C-08)"                    /                                     /usr/sbin/nologin
u     candor-imaint        -   "Candor intake maintenance jobs (C-08)"         /                                     /usr/sbin/nologin
u     candor-migrate       -   "Candor intake schema migrations (ADR-052(9))"  /                                     /usr/sbin/nologin
u     candor-health        -   "Candor health agent (C-25)"                    /                                     /usr/sbin/nologin
u     _chrony              -   "Chrony daemon"                                 /var/lib/chrony                       /usr/sbin/nologin
# No tor control-socket group: the intake tor instance has no control interface
# (AUD-RM2-DEP-04, SPEC-NOTES D-27). config-check.sh --host fails if `_candor-torctl` exists
# or if the group `_tor-candor-intake` has any member.
# Clients of the intake-store IPC socket (07 §5.3: candor-web; candor-sealer for chaff).
# Granted per unit via SupplementaryGroups=, never through /etc/group membership.
g     candor-istore-clients -
