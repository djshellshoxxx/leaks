# The ruleset names service users (meta skuid); load it only after they exist, otherwise nft
# rejects the whole file and the host runs unfiltered. Every Candor intake unit has
# Requires=nftables.service, so a failed load also keeps tor and the services stopped.
[Unit]
After=systemd-sysusers.service
Wants=systemd-sysusers.service
