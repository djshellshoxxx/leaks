#!/usr/sbin/nft -f
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Candor H-INTAKE host firewall (Z-INTAKE: C-05 tor, C-06 web, C-07 sealer, C-08 store).
# Installed as /etc/nftables.conf (root:root 0644) by the installer, which fills ONLY the
# three address sets below with the site's addresses (17-INFRASTRUCTURE.md §4.3: "generated
# by the installer with the site's interface names and addresses"). Everything else is the
# release template; `deploy/tools/config-check.sh` and the self-test (`net.egress`) diff it.
#
# Normative sources: 17 §4.3 ruleset and §4.3.1 egress matrix E1-E5 (prevail per 17 §4.3.1),
# 16-TOR-I2P.md §14.2 flow matrix (I1, I2) and NET-031/NET-041, 20-LOGGING-AUDITING.md LOG-007
# (no LOG/NFLOG targets: drops are only counted), ADR-002 / ADR-009.
#
# Default deny in every direction. Shipped address sets are EMPTY: until the installer fills
# them, I1 (core pull), I2 (ssh), E3 (health push) and E4 (time) match nothing - fail closed.
# Interface names ext0 / relay0 / mgmt0 are fixed by 06/17 (installer renames NICs via .link).

flush ruleset

table inet candor_intake {
  # H-MON collector / NTS source (E3, E4). Installer-filled.
  set mon_hosts  { type ipv4_addr; }
  # Admin jump host for optional sshd (I2). Leave empty when admin is via console/onion.
  set admin_jump { type ipv4_addr; }
  # C-09 relay host on the relay link (I1). Installer-filled.
  set core_relay { type ipv4_addr; }

  # Destinations tor never needs: Tor relays are public addresses. Blocking these stops a
  # compromised tor process from probing the site LAN, the relay or management networks
  # through ext0, and blocks cloud metadata (NET-041, THR-030). (Stricter than 17 §4.3.)
  set non_public4 {
    type ipv4_addr; flags interval;
    elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16,
                 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15,
                 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }
  }
  set non_public6 {
    type ipv6_addr; flags interval;
    elements = { ::/128, ::1/128, ::ffff:0:0/96, 64:ff9b::/96, 100::/64, 2001:db8::/32,
                 fc00::/7, fe80::/10, ff00::/8 }
  }

  # Drop counters, read by the self-test as a boolean "violations since last check"
  # (17 §4.3.1 operational rules). Destination addresses are never logged or exported.
  counter input_dropped {}
  counter output_dropped {}
  counter forward_dropped {}

  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state invalid drop
    ct state established,related accept
    # NET-041: ignore IPv6 router advertisements / redirects (no SLAAC, no route injection).
    icmpv6 type { nd-router-advert, nd-redirect } drop
    # I1: C-09 core-initiated pull and reply push to the C-08 relay endpoint (ADR-009).
    iifname "relay0" ip saddr @core_relay tcp dport 7443 ct state new accept
    # I2 (optional): sshd from the admin jump host only; empty set = disabled.
    iifname "mgmt0" ip saddr @admin_jump tcp dport 22 ct state new accept
    # No HTTP on any NIC: the source web listens only on a Unix socket reached via tor
    # (NET-002). Nothing else is accepted.
    counter name "input_dropped" drop
  }

  chain output {
    type filter hook output priority filter; policy drop;
    oif "lo" accept
    ct state invalid drop
    ct state established,related accept
    # NET-041: never the cloud metadata service, by any UID, on any interface.
    ip daddr 169.254.0.0/16 counter name "output_dropped" drop
    ip6 daddr fd00:ec2::254 counter name "output_dropped" drop
    # Tor needs no DNS, no UDP and no non-public destination (17 §4.3.1 "UDP ... denied").
    meta skuid { "_tor-candor-intake", "_tor-candor-update" } ip daddr @non_public4 counter name "output_dropped" drop
    meta skuid { "_tor-candor-intake", "_tor-candor-update" } ip6 daddr @non_public6 counter name "output_dropped" drop
    # E1: source onion tor instance (C-05) -> Tor relays, TCP only.
    oifname "ext0" meta skuid "_tor-candor-intake" meta l4proto tcp ct state new accept
    # E2: client-only update/time tor instance -> Tor relays, TCP only (ADR-046(3)).
    oifname "ext0" meta skuid "_tor-candor-update" meta l4proto tcp ct state new accept
    # E3: C-25 agent push to the H-MON collector (ARCH-014 push-only).
    oifname "mgmt0" meta skuid "candor-health" ip daddr @mon_hosts tcp dport 8514 ct state new accept
    # E4: chrony to the internal H-MON NTS source only (no public NTP, NET-033).
    oifname "mgmt0" meta skuid "_chrony" ip daddr @mon_hosts udp dport 123 accept
    oifname "mgmt0" meta skuid "_chrony" ip daddr @mon_hosts tcp dport 4460 ct state new accept
    # E5 (Tang, root/clevis) exists ONLY in the initramfs ruleset and is absent here
    # (16 §14.2 E5, 17 §4.3.1 E5; SPEC-NOTES D-09).
    # Everything else - including candor-web, candor-sealer, candor-istore, postgres - is
    # dropped and counted (17 §4.3.1 last row; NET-031).
    counter name "output_dropped" drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    counter name "forward_dropped" drop
  }
}
