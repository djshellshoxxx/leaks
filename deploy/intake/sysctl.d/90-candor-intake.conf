# SPDX-License-Identifier: AGPL-3.0-or-later
# Kernel baseline for H-INTAKE (Z-INTAKE mandatory; 20 §11.4, 17 §5 sysctl row, R7 SI-B-06,
# REQ-H-58; AUD-RM2-DEP-09). Installed as /etc/sysctl.d/90-candor-intake.conf (root 0644).
# config-check.sh checks this file (static mode) and the live /proc/sys values (--host).
#
# ---- Kernel log, pointers, debugging
kernel.printk = 3 3 3 3
kernel.dmesg_restrict = 1
# No "traps:/segfault at" printk lines for crashing source-path processes (exact µs journal
# timestamps, AUD-RM2-DEP-20). OOM-kill lines remain (ADR-053(2) residual).
debug.exception-trace = 0
kernel.kptr_restrict = 2
# No ptrace at all, not even by root (Yama mode 3 cannot be lowered until reboot).
kernel.yama.ptrace_scope = 3
kernel.perf_event_paranoid = 3
# memfds can never be executable (MFD_NOEXEC_SEAL forced; a memfd can never be mapped
# PROT_EXEC), which closes the write-then-mmap(PROT_EXEC) way around MemoryDenyWriteExecute
# that the sealer's memfd hand-over would otherwise open (ADR-055(1), AUD-RM2-DEP-29).
# Kernel >= 6.3 (Debian 13: 6.12); the value can only be raised in a pid namespace.
vm.memfd_noexec = 2
kernel.kexec_load_disabled = 1
kernel.sysrq = 0
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# No unprivileged user namespaces. config-check's nftables check uses `unshare -n` as root
# (CAP_SYS_ADMIN, no user namespace), and no unit uses PrivateUsers=, so 0 breaks nothing.
user.max_user_namespaces = 0
#
# ---- Core dumps (REQ-H-58): never written, also not through a pipe helper
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0
#
# ---- Filesystem link/FIFO protections
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
#
# ---- Memory: swap is disabled on Z-INTAKE (20 §11.4); never prefer swapping if it appears
vm.swappiness = 0
vm.unprivileged_userfaultfd = 0
#
# ---- Network: no routing, no redirects/source routes, no martian logging (would record
# addresses in the kernel log, LOG-007), no TCP timestamps (clock-skew fingerprinting of the
# onion host through tor's guard connections, 17 sysctl row)
net.ipv4.ip_forward = 0
net.ipv4.conf.all.forwarding = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 0
net.ipv4.conf.default.log_martians = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_timestamps = 0
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
