# Temporary one-shot RM-3 integration helper. It is restricted to the owned
# integration branch, applies only canonical tool output, and deletes itself
# in the generated-state commit.
name: rm3-generate-preview

on:
  pull_request:

permissions: {}

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/complete-rm3-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/complete-rm3-core
          persist-credentials: true
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: Apply canonical formatting and lockfile
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          rm .github/workflows/rm3-generate-preview.yml
          git config user.name sheldon
          git config user.email 127660907+djshellshoxxx@users.noreply.github.com
          git add Cargo.lock crates/candor-authz crates/candor-case crates/candor-ekv crates/candor-notify crates/candor-relay crates/candor-retention .github/workflows/rm3-generate-preview.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m 'chore(rm3): apply canonical generated state'
          git push origin HEAD:chatgpt/complete-rm3-core
