# SPDX-License-Identifier: AGPL-3.0-or-later
name: rm3-integration-refresh

on:
  push:
    branches: ["chatgpt/complete-rm3-core"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'build: refresh generated integration files') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: Refresh generated integration files
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          for crate in candor-authz candor-case candor-ekv candor-notify candor-relay candor-retention; do
            if ! grep -q "^\[policy\.$crate\]$" supply-chain/config.toml; then
              printf '\n[policy.%s]\ncriteria = "safe-to-deploy"\n' "$crate" >> supply-chain/config.toml
            fi
          done
          git config user.name "sheldon"
          git config user.email "127660907+djshellshoxxx@users.noreply.github.com"
          git add Cargo.lock crates/candor-authz crates/candor-case crates/candor-ekv crates/candor-notify crates/candor-relay crates/candor-retention supply-chain/config.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m "build: refresh generated integration files"
          git push origin HEAD:${GITHUB_REF_NAME}
